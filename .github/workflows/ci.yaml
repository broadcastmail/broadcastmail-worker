name: CI

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [master, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and test
        run: ./mvnw clean verify -Dgroups='!local'
        env:
          ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && github.repository_owner == 'broadcastmail'
    steps:
      - uses: actions/checkout@v5

      - name: Enable maintenance mode
        run: |
          curl -X PATCH "https://api.vercel.com/v1/global-config/${{ secrets.EDGE_CONFIG_ID }}/items" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"items": [{"operation": "update", "key": "isInMaintenanceMode", "value": true}]}'

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway redeploy --service worker --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Disable maintenance mode
        if: always()
        run: |
          curl -X PATCH "https://api.vercel.com/v1/global-config/${{ secrets.EDGE_CONFIG_ID }}/items" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"items": [{"operation": "update", "key": "isInMaintenanceMode", "value": false}]}'

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'broadcastmail'
    steps:
      - uses: actions/checkout@v5

      - name: Enable maintenance mode
        run: |
          curl -X PATCH "https://api.vercel.com/v1/global-config/${{ secrets.EDGE_CONFIG_ID }}/items" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"items": [{"operation": "update", "key": "isInMaintenanceMode", "value": true}]}'

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli
          railway redeploy --service worker --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Disable maintenance mode
        if: always()
        run: |
          curl -X PATCH "https://api.vercel.com/v1/global-config/${{ secrets.EDGE_CONFIG_ID }}/items" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"items": [{"operation": "update", "key": "isInMaintenanceMode", "value": false}]}'