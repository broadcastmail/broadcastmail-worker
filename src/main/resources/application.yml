spring:
  config:
    import: optional:classpath:sentry-release.properties
  main:
    # No web server, and the outbox listener is a virtual thread: without this the JVM exits after startup.
    keep-alive: true
  datasource:
    url: jdbc:postgresql://${PGBOUNCER_HOST:${PGHOST}}:${PGBOUNCER_PORT:${PGPORT}}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  # broadcastmail-api owns schema migrations (see docs/DATABASE.md in that repo);
  # worker only ever validates against the schema, never mutates it. Migrations
  # still ride on the classpath via broadcastmail-common so this flag matters,
  # not just an absent folder like before.
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false

app:
  datasource:
    direct:
      url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
      username: ${PGUSER}
      password: ${PGPASSWORD}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 2
        pool-name: direct-pool
  encryption:
    key: ${ENCRYPTION_KEY}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  api:
    # Public URL of the API; the List-Unsubscribe header points here. No default: a wrong host breaks one-click unsubscribe silently.
    public-url: ${API_PUBLIC_URL}
  unsubscribe-secret: ${UNSUBSCRIBE_SECRET}
  outbox:
    # How many entries to claim per poll cycle. Set higher for paid Resend plans.
    # The worker chunks into batches of 100 (Resend batch API max) automatically.
    poll-limit: ${OUTBOX_POLL_LIMIT:1000}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: production
  tags:
    service: worker
